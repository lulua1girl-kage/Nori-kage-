name: Build Nori APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract Nori V36.5 project
        shell: bash
        run: |
          set -e
          rm -rf .nori-v36
          mkdir -p .nori-v36
          unzip -q "nori-v36_5-build-script-fixed.zip" -d .nori-v36
          PROJECT_DIR="$(find .nori-v36 -type d -name 'v364-connect' -print -quit)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find v364-connect inside the V36.5 ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Nori project at: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools"
          echo "Android SDK prepared."

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Repair V36.5 Java source compatibility
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          JAVA="android/app/src/main/java"

          # npm compatibility
          sed -i 's/"@capacitor-community\/speech-recognition": "8\.0\.0"/"@capacitor-community\/speech-recognition": "7.0.1"/' package.json

          # Capacitor callback types are supplied by the Capacitor Android API.
          for f in             "$JAVA/com/nori/jarvis/NoriKnowledgePlugin.java"             "$JAVA/com/nori/jarvis/visual/NoriExamIntegrityPlugin.java"             "$JAVA/com/nori/jarvis/visual/NoriVisualPlugin.java"; do
            if [ -f "$f" ]; then
              grep -q 'import com.getcapacitor.ActivityCallback;' "$f" ||                 sed -i '/^package /a import com.getcapacitor.ActivityCallback;\nimport com.getcapacitor.ActivityResult;' "$f"
            fi
          done

          # Resolve the actual package names present in this ZIP instead of assuming
          # the source files use the package names referenced by older V36 builds.
          BRAIN_FILE="$(find "$JAVA" -type f -name 'NoriBrain.java' -print -quit)"
          if [ -n "$BRAIN_FILE" ]; then
            BRAIN_PKG="$(grep '^package ' "$BRAIN_FILE" | sed 's/^package //;s/;//')"
            sed -i "s/import brain\.NoriBrain;/import $BRAIN_PKG.NoriBrain;/" "$JAVA/com/nori/jarvis/nori/NoriNativeCore.java" || true
            sed -i "s/brain\.NoriBrain/$BRAIN_PKG.NoriBrain/g" "$JAVA/com/nori/jarvis/nori/NoriNativeCore.java"
          fi

          ORCH_FILE="$(find "$JAVA" -type f -name 'NoriMetaBrainOrchestrator.java' -print -quit)"
          if [ -n "$ORCH_FILE" ]; then
            ORCH_PKG="$(grep '^package ' "$ORCH_FILE" | sed 's/^package //;s/;//')"
            META="$JAVA/com/nori/jarvis/NoriMetaBrainPlugin.java"
            grep -q "import $ORCH_PKG.NoriMetaBrainOrchestrator;" "$META" ||               sed -i "/^package /a import $ORCH_PKG.NoriMetaBrainOrchestrator;" "$META"
          fi

          AUTH_FILE="$(find "$JAVA" -type f -name 'NoriSessionAuthority.java' -print -quit)"
          if [ -n "$AUTH_FILE" ]; then
            AUTH_PKG="$(grep '^package ' "$AUTH_FILE" | sed 's/^package //;s/;//')"
            KNOW="$JAVA/com/nori/jarvis/NoriKnowledgePlugin.java"
            grep -q "import $AUTH_PKG.NoriSessionAuthority;" "$KNOW" ||               sed -i "/^package /a import $AUTH_PKG.NoriSessionAuthority;" "$KNOW"
          fi

          # The Android biometric class lives under android.hardware.biometrics.
          BIO="$JAVA/com/nori/jarvis/NoriBiometricPlugin.java"
          if [ -f "$BIO" ]; then
            sed -i 's/^import android\.app\.BiometricPrompt;/import android.hardware.biometrics.BiometricPrompt;/' "$BIO"
          fi

          # metric() returns a LinearLayout in this V36.5 implementation.
          THEME="$JAVA/com/nori/jarvis/nori/ui/NoriTheme.java"
          if [ -f "$THEME" ]; then
            sed -i 's/public static TextView metric(/public static LinearLayout metric(/' "$THEME"
          fi

          # Match the notification builder implementation.
          ALARM="$JAVA/com/nori/jarvis/nori/android/alarm/NoriAlarmReceiver.java"
          if [ -f "$ALARM" ]; then
            sed -i 's/NotificationCompat\.Builder builder = new NotificationCompat\.Builder/Notification.Builder builder = new Notification.Builder/' "$ALARM"
            sed -i '/import androidx.core.app.NotificationCompat;/d' "$ALARM"
          fi

          # State is an enum in the V36.5 implementation.
          VIEW="$JAVA/com/nori/jarvis/nori/presence/NoriInteractiveCircleView.java"
          if [ -f "$VIEW" ]; then
            sed -i 's/state\.name,/state.name(),/' "$VIEW"
          fi

          # NoriDataRepository calls rawQuery() on the wrapper. If this wrapper
          # does not expose it, add a small compatibility bridge that discovers
          # its SQLiteDatabase field without changing the public repository API.
          DB="$(find "$JAVA" -type f -name 'NoriDatabase.java' -print -quit)"
          if [ -n "$DB" ] && ! grep -q 'Cursor rawQuery(' "$DB"; then
            sed -i '/^}/i\
    public android.database.Cursor rawQuery(String sql, String[] args) {\
        try {\
            java.lang.reflect.Field f = null;\
            Class<?> c = getClass();\
            while (c != null && f == null) {\
                for (java.lang.reflect.Field x : c.getDeclaredFields()) {\
                    if (android.database.sqlite.SQLiteDatabase.class.isAssignableFrom(x.getType())) { f = x; break; }\
                }\
                c = c.getSuperclass();\
            }\
            if (f == null) throw new IllegalStateException("No SQLiteDatabase field found");\
            f.setAccessible(true);\
            android.database.sqlite.SQLiteDatabase db = (android.database.sqlite.SQLiteDatabase) f.get(this);\
            return db.rawQuery(sql, args);\
        } catch (Exception e) { throw new IllegalStateException(e); }\
    }' "$DB"
          fi

          echo "V36.5 compatibility repair complete."
          echo "Resolved native sources:"
          find "$JAVA" -type f -name '*.java' | sort | sed -n '1,300p'

      - name: Install web dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Sync Capacitor Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -e
          curl -fsSL -o /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          rm -rf /tmp/gradle-8.13
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle --version

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          /tmp/gradle-8.13/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nori-debug-apk
          path: .nori-v36/**/android/app/build/outputs/apk/debug/*.apk
