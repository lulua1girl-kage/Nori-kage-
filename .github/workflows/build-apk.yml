name: Build Nori APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract Nori V36.5 project
        shell: bash
        run: |
          set -e
          rm -rf .nori-v36
          mkdir -p .nori-v36
          unzip -q "nori-v36_5-build-script-fixed.zip" -d .nori-v36
          PROJECT_DIR="$(find .nori-v36 -type d -name 'v364-connect' -print -quit)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" platform-tools

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Repair V36.5 native source mismatches
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main/java")
          files = list(root.rglob("*.java"))
          by_name = {p.name: p for p in files}

          def package_of(p):
              m = re.search(r'^package\s+([\w.]+)\s*;', p.read_text(errors="ignore"), re.M)
              return m.group(1) if m else None

          def add_import(p, fqcn):
              s = p.read_text()
              if f"import {fqcn};" not in s:
                  s = re.sub(r'(^package\s+[\w.]+\s*;)', r'\1\nimport ' + fqcn + ';', s, count=1, flags=re.M)
                  p.write_text(s)

          pkg = Path("package.json")
          s = pkg.read_text()
          s = s.replace('"@capacitor-community/speech-recognition": "8.0.0"',
                        '"@capacitor-community/speech-recognition": "7.0.1"')
          pkg.write_text(s)

          for name in ["NoriKnowledgePlugin.java", "NoriExamIntegrityPlugin.java", "NoriVisualPlugin.java"]:
              p = by_name.get(name)
              if p:
                  add_import(p, "com.getcapacitor.ActivityCallback")
                  add_import(p, "com.getcapacitor.ActivityResult")

          p = by_name.get("NoriBrain.java")
          core = by_name.get("NoriNativeCore.java")
          if p and core:
              fq = package_of(p) + ".NoriBrain"
              core.write_text(core.read_text().replace("brain.NoriBrain", fq))

          p = by_name.get("NoriMetaBrainOrchestrator.java")
          meta = by_name.get("NoriMetaBrainPlugin.java")
          if p and meta:
              add_import(meta, package_of(p) + ".NoriMetaBrainOrchestrator")

          p = by_name.get("NoriSessionAuthority.java")
          know = by_name.get("NoriKnowledgePlugin.java")
          if p and know:
              add_import(know, package_of(p) + ".NoriSessionAuthority")

          bio = by_name.get("NoriBiometricPlugin.java")
          if bio:
              bio.write_text(bio.read_text().replace(
                  "import android.app.BiometricPrompt;",
                  "import android.hardware.biometrics.BiometricPrompt;"))

          theme = by_name.get("NoriTheme.java")
          if theme:
              theme.write_text(theme.read_text().replace(
                  "public static TextView metric(",
                  "public static LinearLayout metric("))

          alarm = by_name.get("NoriAlarmReceiver.java")
          if alarm:
              s = alarm.read_text()
              s = s.replace(
                  "NotificationCompat.Builder builder = new NotificationCompat.Builder",
                  "Notification.Builder builder = new Notification.Builder")
              s = s.replace("import androidx.core.app.NotificationCompat;\n", "")
              alarm.write_text(s)

          view = by_name.get("NoriInteractiveCircleView.java")
          if view:
              view.write_text(view.read_text().replace("state.name,", "state.name(),"))

          db = by_name.get("NoriDatabase.java")
          if db and "Cursor rawQuery(" not in db.read_text():
              s = db.read_text()
              fields = re.findall(
                  r'(?:private|protected|public)?\s*(?:final\s+)?SQLiteDatabase\s+(\w+)\s*[;=]',
                  s)
              field = fields[0] if fields else None
              if field:
                  method = (
                      "\n    public android.database.Cursor rawQuery(String sql, String[] args) {\n"
                      f"        return {field}.rawQuery(sql, args);\n"
                      "    }\n")
                  pos = s.rfind("}")
                  db.write_text(s[:pos] + method + s[pos:])

          print("Native V36.5 compatibility repairs applied.")
          PY

      - name: Install web dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Sync Capacitor Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -e
          curl -fsSL -o /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          rm -rf /tmp/gradle-8.13
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle --version

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          /tmp/gradle-8.13/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nori-debug-apk
          path: .nori-v36/**/android/app/build/outputs/apk/debug/*.apk
