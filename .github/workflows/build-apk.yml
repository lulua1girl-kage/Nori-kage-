name: Build Nori APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract Nori V36.5 project
        shell: bash
        run: |
          rm -rf .nori-v36
          mkdir .nori-v36
          unzip -q "nori-v36_5-build-script-fixed.zip" -d .nori-v36
          PROJECT_DIR="$(find .nori-v36 -type d -name 'v364-connect' -print -quit)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find v364-connect inside the V36.5 ZIP."
            unzip -l "nori-v36_5-build-script-fixed.zip" | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Nori project at: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools"
          echo "Android SDK prepared."

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fix unavailable speech recognition package version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          sed -i 's/"@capacitor-community\/speech-recognition": "8\.0\.0"/"@capacitor-community\/speech-recognition": "7.0.1"/' package.json
          echo "Speech recognition package pinned to 7.0.1."

      - name: Install web dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Sync Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          echo "Gradle wrapper is executable."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nori-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
