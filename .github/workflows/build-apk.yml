name: Build Nori APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract Nori V36.5 project
        shell: bash
        run: |
          set -e
          rm -rf .nori-v36
          mkdir -p .nori-v36
          unzip -q "nori-v36_5-build-script-fixed.zip" -d .nori-v36
          PROJECT_DIR="$(find .nori-v36 -type d -name 'v364-connect' -print -quit)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find v364-connect inside the V36.5 ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Nori project at: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools"
          echo "Android SDK prepared."

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply build compatibility fixes
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          sed -i 's/"@capacitor-community\/speech-recognition": "8\.0\.0"/"@capacitor-community\/speech-recognition": "7.0.1"/' package.json

          sed -i 's/^import android\.app\.BiometricPrompt;/import android.hardware.biometrics.BiometricPrompt;/'             android/app/src/main/java/com/nori/jarvis/NoriBiometricPlugin.java

          sed -i 's/public static TextView metric(/public static LinearLayout metric(/'             android/app/src/main/java/com/nori/jarvis/nori/ui/NoriTheme.java

          sed -i 's/Notification.Builder builder = new NotificationCompat.Builder(context, NoriNotificationService.CHANNEL_REMINDERS)/Notification.Builder builder = new Notification.Builder(context, NoriNotificationService.CHANNEL_REMINDERS)/'             android/app/src/main/java/com/nori/jarvis/nori/android/alarm/NoriAlarmReceiver.java
          sed -i '/import androidx.core.app.NotificationCompat;/d'             android/app/src/main/java/com/nori/jarvis/nori/android/alarm/NoriAlarmReceiver.java

          echo "Applied source compatibility fixes."

      - name: Install web dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Sync Capacitor Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -e
          curl -fsSL -o /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          rm -rf /tmp/gradle-8.13
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle --version

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          /tmp/gradle-8.13/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nori-debug-apk
          path: .nori-v36/**/android/app/build/outputs/apk/debug/*.apk
