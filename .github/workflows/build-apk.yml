name: Build Nori APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract Nori V36.5 project
        shell: bash
        run: |
          set -e
          rm -rf .nori-v36
          mkdir -p .nori-v36
          unzip -q "nori-v36_5-build-script-fixed.zip" -d .nori-v36
          PROJECT_DIR="$(find .nori-v36 -type d -name 'v364-connect' -print -quit)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" platform-tools "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Repair V36.5 source and dependency compatibility
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main/java")
          files = list(root.rglob("*.java"))
          by_name = {p.name: p for p in files}

          def package_of(p):
              m = re.search(r'^package\s+([\w.]+)\s*;', p.read_text(errors="ignore"), re.M)
              return m.group(1) if m else None

          def add_import(p, fqcn):
              s = p.read_text()
              if f"import {fqcn};" not in s:
                  s = re.sub(r'(^package\s+[\w.]+\s*;)', r'\1\nimport ' + fqcn + ';', s, count=1, flags=re.M)
                  p.write_text(s)

          pkg = Path("package.json")
          s = pkg.read_text().replace('"@capacitor-community/speech-recognition": "8.0.0"', '"@capacitor-community/speech-recognition": "7.0.1"')
          pkg.write_text(s)

          for name in ["NoriKnowledgePlugin.java", "NoriExamIntegrityPlugin.java", "NoriVisualPlugin.java"]:
              p = by_name.get(name)
              if p:
                  add_import(p, "androidx.activity.result.ActivityResult")
                  add_import(p, "com.getcapacitor.annotation.ActivityCallback")

          brain = by_name.get("NoriBrain.java")
          core = by_name.get("NoriNativeCore.java")
          if brain and core:
              fq = package_of(brain) + ".NoriBrain"
              s = core.read_text().replace("brain.NoriBrain", fq)
              if f"import {fq};" not in s:
                  s = re.sub(r'(^package\s+[\w.]+\s*;)', r'\1\nimport ' + fq + ';', s, count=1, flags=re.M)
              core.write_text(s)

          orch = by_name.get("NoriMetaBrainOrchestrator.java")
          meta = by_name.get("NoriMetaBrainPlugin.java")
          if orch and meta:
              add_import(meta, package_of(orch) + ".NoriMetaBrainOrchestrator")

          auth = by_name.get("NoriSessionAuthority.java")
          know = by_name.get("NoriKnowledgePlugin.java")
          if auth and know:
              add_import(know, package_of(auth) + ".NoriSessionAuthority")

          bio = by_name.get("NoriBiometricPlugin.java")
          if bio:
              bio.write_text(bio.read_text().replace("import android.app.BiometricPrompt;", "import android.hardware.biometrics.BiometricPrompt;"))

          theme = by_name.get("NoriTheme.java")
          if theme:
              theme.write_text(theme.read_text().replace("public static TextView metric(", "public static LinearLayout metric("))

          alarm = by_name.get("NoriAlarmReceiver.java")
          if alarm:
              s = alarm.read_text().replace("import androidx.core.app.NotificationCompat;\n", "")
              s = s.replace("Notification.Builder builder = new NotificationCompat.Builder(context, NoriNotificationService.CHANNEL_REMINDERS)", "Notification.Builder builder = new Notification.Builder(context)")
              alarm.write_text(s)

          db = by_name.get("NoriDatabase.java")
          if db and "public android.database.Cursor rawQuery(" not in db.read_text():
              s = db.read_text()
              pos = s.rfind("}")
              method = """
              public android.database.Cursor rawQuery(String sql, String[] args) {
                  return getReadableDatabase().rawQuery(sql, args);
              }
              """
              db.write_text(s[:pos] + method + s[pos:])

          view = by_name.get("NoriInteractiveCircleView.java")
          if view:
              view.write_text(view.read_text().replace("state.name,", "state.name(),"))

          # Diagnostic startup mode: use only the clean Capacitor launcher.
          main = Path("android/app/src/main/java/com/nori/jarvis/MainActivity.java")
          if main.exists():
              main.write_text("""package com.nori.jarvis;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
          }
          """)
              main.write_text("\n".join(line[10:] if line.startswith("          ") else line for line in main.read_text().splitlines()) + "\n")

          print("Source repairs applied; MainActivity reduced to a clean Capacitor launcher.")
          PY

      - name: Apply production admission gate
        shell: bash
        run: |
          set -e
          test -f nori-patches/admission-gate-v2.js
          cp nori-patches/admission-gate-v2.js "$PROJECT_DIR/www/nori-auth-gate-v1.js"
          node --check "$PROJECT_DIR/www/nori-auth-gate-v1.js"
          grep -q "danatbayu@gmail.com" "$PROJECT_DIR/www/nori-auth-gate-v1.js"
          grep -q "mirasutton58@gmail.com" "$PROJECT_DIR/www/nori-auth-gate-v1.js"
          grep -q "justicesteve.councle@gmail.com" "$PROJECT_DIR/www/nori-auth-gate-v1.js"
          echo "Admission gate patched and syntax-checked."

      - name: Install web dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Sync Capacitor Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Disable incompatible speech plugin for startup test
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("android/app/src/main/assets/capacitor.plugins.json")
          data = json.loads(p.read_text())
          data = [x for x in data if x.get("pkg") != "@capacitor-community/speech-recognition"]
          p.write_text(json.dumps(data, indent=2) + "\n")
          print("Remaining auto-loaded Capacitor plugins:")
          print(json.dumps(data, indent=2))
          PY

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -e
          curl -fsSL -o /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          rm -rf /tmp/gradle-8.13
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle --version

      - name: Force clean standalone Android 13-compatible install package
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/android"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          # Give this build a distinct application ID so Android can install it
          # even when an older Nori build is already signed with another key.
          s2, n = re.subn(r'(applicationId\\s+)["\\'][^"\\']+["\\']', r'\\1"com.nori.jarvis.v365clean"', s, count=1)
          if n != 1:
              raise SystemExit("Could not locate exactly one applicationId in app/build.gradle")
          p.write_text(s2)
          print("Standalone applicationId: com.nori.jarvis.v365clean")
          PY

      - name: Build clean debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          /tmp/gradle-8.13/bin/gradle clean assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e
          APK="$(find "$PROJECT_DIR/android/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/nori-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/nori-debug.apk"

      - name: Verify APK integrity and signing
        shell: bash
        run: |
          set -e
          APK="$GITHUB_WORKSPACE/nori-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --min-sdk-version 23 "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 4 -v 4 "$APK"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          test -x "$AAPT2"
          BADGING="$("$AAPT2" dump badging "$APK")"
          echo "$BADGING"
          ! echo "$BADGING" | grep -q "testOnly='true'"
          echo "$BADGING" | grep -q "package: name='com.nori.jarvis.v365clean'"
          unzip -t "$APK" >/dev/null
          echo "APK signature, alignment, manifest, package ID, and ZIP integrity verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nori-debug-apk
          path: ./nori-debug.apk
          if-no-files-found: error
