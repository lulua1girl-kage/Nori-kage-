name: Build Nori APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract Nori V36.5 project
        shell: bash
        run: |
          set -e
          rm -rf .nori-v36
          mkdir -p .nori-v36
          unzip -q "nori-v36_5-build-script-fixed.zip" -d .nori-v36
          PROJECT_DIR="$(find .nori-v36 -type d -name 'v364-connect' -print -quit)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" platform-tools

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Repair V36.5 source and dependency compatibility
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main/java")
          files = list(root.rglob("*.java"))
          by_name = {p.name: p for p in files}

          def package_of(p):
              m = re.search(r'^package\s+([\w.]+)\s*;', p.read_text(errors="ignore"), re.M)
              return m.group(1) if m else None

          def add_import(p, fqcn):
              s = p.read_text()
              if f"import {fqcn};" not in s:
                  s = re.sub(
                      r'(^package\s+[\w.]+\s*;)',
                      r'\1\nimport ' + fqcn + ';',
                      s, count=1, flags=re.M)
                  p.write_text(s)

          # The ZIP declares the speech plugin at 8.0.0, but that package
          # version is unavailable to npm. Keep the known installable pin.
          pkg = Path("package.json")
          s = pkg.read_text()
          s = s.replace(
              '"@capacitor-community/speech-recognition": "8.0.0"',
              '"@capacitor-community/speech-recognition": "7.0.1"')
          pkg.write_text(s)

          # Capacitor 8 uses AndroidX ActivityResult and puts the callback
          # annotation under com.getcapacitor.annotation.
          for name in [
              "NoriKnowledgePlugin.java",
              "NoriExamIntegrityPlugin.java",
              "NoriVisualPlugin.java"
          ]:
              p = by_name.get(name)
              if p:
                  s = p.read_text()
                  add_import(p, "androidx.activity.result.ActivityResult")
                  add_import(p, "com.getcapacitor.annotation.ActivityCallback")

          # Resolve actual V36.5 brain package.
          brain = by_name.get("NoriBrain.java")
          core = by_name.get("NoriNativeCore.java")
          if brain and core:
              fq = package_of(brain) + ".NoriBrain"
              s = core.read_text()
              s = s.replace("brain.NoriBrain", fq)
              if f"import {fq};" not in s:
                  s = re.sub(r'(^package\s+[\w.]+\s*;)',
                             r'\1\nimport ' + fq + ';', s, count=1, flags=re.M)
              core.write_text(s)

          # Resolve actual V36.5 meta-brain package.
          orch = by_name.get("NoriMetaBrainOrchestrator.java")
          meta = by_name.get("NoriMetaBrainPlugin.java")
          if orch and meta:
              add_import(meta, package_of(orch) + ".NoriMetaBrainOrchestrator")

          # Resolve the session-authority package if present.
          auth = by_name.get("NoriSessionAuthority.java")
          know = by_name.get("NoriKnowledgePlugin.java")
          if auth and know:
              add_import(know, package_of(auth) + ".NoriSessionAuthority")

          # Keep Android framework biometric API compatible.
          bio = by_name.get("NoriBiometricPlugin.java")
          if bio:
              s = bio.read_text().replace(
                  "import android.app.BiometricPrompt;",
                  "import android.hardware.biometrics.BiometricPrompt;")
              bio.write_text(s)

          # V36.5 NoriTheme.metric returns LinearLayout.
          theme = by_name.get("NoriTheme.java")
          if theme:
              s = theme.read_text().replace(
                  "public static TextView metric(",
                  "public static LinearLayout metric(")
              theme.write_text(s)

          # NoriAlarmReceiver already uses Notification.Builder downstream;
          # remove the stale NotificationCompat construction.
          alarm = by_name.get("NoriAlarmReceiver.java")
          if alarm:
              s = alarm.read_text()
              s = s.replace("import androidx.core.app.NotificationCompat;\n", "")
              s = s.replace(
                  "Notification.Builder builder = new NotificationCompat.Builder("
                  "context, NoriNotificationService.CHANNEL_REMINDERS)",
                  "Notification.Builder builder = new Notification.Builder(context)")
              alarm.write_text(s)

          # NativeDataRepository expects a rawQuery bridge on NoriDatabase.
          db = by_name.get("NoriDatabase.java")
          if db and "public android.database.Cursor rawQuery(" not in db.read_text():
              s = db.read_text()
              pos = s.rfind("}")
              method = """
              public android.database.Cursor rawQuery(String sql, String[] args) {
                  return getReadableDatabase().rawQuery(sql, args);
              }
              """
              db.write_text(s[:pos] + method + s[pos:])

          # State is an enum in the V36.5 interactive view.
          view = by_name.get("NoriInteractiveCircleView.java")
          if view:
              view.write_text(view.read_text().replace("state.name,", "state.name(),"))

          print("All known V36.5 source compatibility repairs applied.")
          PY

      - name: Install web dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Sync Capacitor Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -e
          curl -fsSL -o /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          rm -rf /tmp/gradle-8.13
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle --version

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          /tmp/gradle-8.13/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e
          APK="$(find "$PROJECT_DIR/android/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/nori-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/nori-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nori-debug-apk
          path: ./nori-debug.apk
          if-no-files-found: error
